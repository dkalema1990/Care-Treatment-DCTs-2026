name: Keep Streamlit App Awake

on:
  schedule:
    # Every 6 hours -- comfortably under Streamlit Cloud's 12-hour sleep
    # threshold, even allowing for a missed/delayed run.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
    # ^ lets you trigger this manually from the Actions tab to test it.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: pip install selenium

      - name: Visit the app to keep it awake
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: python scripts/keep_alive.py
